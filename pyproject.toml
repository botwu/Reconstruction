[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.3.0"
description = "从真实回流 session 重建可验证任务与环境"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypdf[fonts]==6.19.0", "fonttools==4.66.1"]

[project.scripts]
traceforge = "traceforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.package-data]
"traceforge.reconstruction" = ["researcher_instruction.md", "search_vendor/*.whl", "search_vendor_lock.json"]
"traceforge.failure_analysis" = ["assets/**/*.py", "assets/**/*.md", "reference_assets/*.json", "reference_assets/*.txt", "reference_assets/*.md"]
"traceforge.verifier" = ["vendor/*.whl", "vendor_lock.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "live: 需要北京 AGS / TokenHub 的 Harbor 活跑",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
