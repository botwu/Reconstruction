[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.3.0"
description = "将真实回流轨迹编译为可审计任务与环境约束"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
traceforge = "traceforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.package-data]
traceforge.failure_analysis = ["assets/**/*.py", "assets/**/*.md", "reference_assets/*.json", "reference_assets/*.txt", "reference_assets/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
